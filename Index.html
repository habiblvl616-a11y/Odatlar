<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kunlik odatlar</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fffaf3;--card:#fff;--tx:#1d1b2e;--mut:#6b6880;--ac:#e8453c;--ok:#1f9d55;--ln:#1d1b2e;--sh:#1d1b2e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14131f;--card:#1f1d30;--tx:#f4f1ff;--mut:#a9a5c4;--ac:#ff6b5e;--ok:#3ddc84;--ln:#f4f1ff;--sh:#000}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14131f;--card:#1f1d30;--tx:#f4f1ff;--mut:#a9a5c4;--ac:#ff6b5e;--ok:#3ddc84;--ln:#f4f1ff;--sh:#000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{margin:0 0 14px;font-size:1.6rem;display:inline-block;transform:rotate(-1.5deg);background:var(--ac);color:#fff;padding:4px 14px;border:3px solid var(--ln);box-shadow:5px 5px 0 var(--sh)}
.card{background:var(--card);border:3px solid var(--ln);box-shadow:5px 5px 0 var(--sh);padding:14px;margin-bottom:14px}
input{font:inherit;width:100%;padding:11px;margin:0 0 8px;border:3px solid var(--ln);background:var(--card);color:var(--tx)}
button{font:inherit;font-weight:800;cursor:pointer;padding:10px 14px;border:3px solid var(--ln);background:var(--ac);color:#fff;box-shadow:3px 3px 0 var(--sh)}
button.g{background:var(--card);color:var(--tx)}
.big{width:100%}
.row{display:flex;gap:8px}
.row>*{flex:1}
.mut{color:var(--mut);font-size:.88rem}
.item{display:flex;align-items:center;gap:12px}
.chk{flex:none;width:46px;height:46px;font-size:1.5rem;padding:0;background:var(--card);color:var(--ok)}
.item.d .chk{background:var(--ok);color:#fff}
.item.d b{text-decoration:line-through;opacity:.6}
.item div{flex:1;min-width:0}
.item b{display:block;word-break:break-word}
.bar{height:16px;border:3px solid var(--ln);background:var(--card);margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
#alarm{display:none;position:fixed;inset:0;z-index:99;background:var(--ac);color:#fff;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:16px}
#alarm.on{display:flex;animation:fl .6s infinite alternate}
#alarm .t{font-size:2.2rem;font-weight:900;word-break:break-word}
#alarm .e{font-size:5rem}
#alarm button{background:#fff;color:#1d1b2e;border-color:#1d1b2e;font-size:1.2rem;min-width:230px}
@keyframes fl{to{filter:brightness(1.25)}}
</style>
</head>
<body>
<div class="wrap">
<h1>🔥 KUNLIK ODATLAR</h1>

<div class="card">
<button class="big g" onclick="enable()">🔔 Ovoz va bildirishnomani yoqish</button>
<div class="mut" id="st" style="margin-top:8px">Avval shu tugmani bosing, aks holda ovoz chiqmaydi.</div>
</div>

<div class="card">
<div class="mut" id="day"></div>
<b id="prog"></b>
<div class="bar"><i id="pb"></i></div>
</div>

<div id="list"></div>

<div class="card">
<input id="nm" placeholder="Yangi odat (masalan: Suv ichish)">
<div class="row"><input id="tm" type="time" value="09:00"><button onclick="add()">+ Qoʻshish</button></div>
<div class="mut">Odat har kuni shu vaqtda sizga eslatadi.</div>
</div>

<button class="g big" onclick="ring({n:'Sinov: ovoz ishlayapti!'},true)">🔊 Ovozni sinab koʻrish</button>
<p class="mut">Muhim: signal ilova ochiq turganda va telefon ekrani oʻchmaganda ishlaydi.</p>
</div>

<div id="alarm"><div class="e">⏰</div><div class="t" id="at"></div>
<button onclick="doneNow()">✅ Bajardim</button>
<button onclick="stop()">🔕 Keyinroq</button></div>

<script>
var KEY='odat_v1',H=load(),ctx=null,timer=null,cur=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(H))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pad(n){return n<10?'0'+n:n}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return ds(new Date())}
function streak(h){
 var d=new Date(),n=0;
 if(h.days.indexOf(ds(d))<0)d.setDate(d.getDate()-1);
 while(h.days.indexOf(ds(d))>=0){n++;d.setDate(d.getDate()-1)}
 return n;
}
function LN(){return window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications}
async function sched(){var p=LN();if(!p)return;try{
 var q=await p.getPending();if(q.notifications.length)await p.cancel({notifications:q.notifications});
 if(!H.length)return;
 await p.schedule({notifications:H.map(function(h,i){var a=h.t.split(':');return{id:i+1,title:'Odat vaqti',body:h.n,schedule:{on:{hour:+a[0],minute:+a[1]},allowWhileIdle:true}}})});
}catch(e){}}
function enable(){
 try{var pl=LN();if(pl)pl.requestPermissions().then(sched)}catch(e){}
 try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume();beep(.1)}catch(e){}
 try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}
 try{if(window.speechSynthesis)speechSynthesis.speak(new SpeechSynthesisUtterance(' '))}catch(e){}
 try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){})}catch(e){}
 st.textContent='✅ Yoqildi. Ilovani ochiq va ekranni yoniq qoldiring.';
}
function beep(d){
 if(!ctx)return;
 var o=ctx.createOscillator(),g=ctx.createGain();
 o.type='square';o.frequency.value=880;g.gain.value=.5;
 o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+(d||.25));
}
function add(){
 var n=nm.value.trim();if(!n||!tm.value)return;
 H.push({id:Date.now(),n:n,t:tm.value,days:[],rang:''});
 save();nm.value='';draw();enable();sched();
}
function del(id){H=H.filter(function(x){return x.id!==id});save();draw();sched()}
function tog(id){
 var h=H.filter(function(x){return x.id===id})[0],t=today(),i=h.days.indexOf(t);
 if(i<0)h.days.push(t);else h.days.splice(i,1);
 save();draw();
}
function draw(){
 var t=today(),done=0;
 var s=H.slice().sort(function(a,b){return a.t<b.t?-1:1});
 document.getElementById('list').innerHTML=s.map(function(h){
  var d=h.days.indexOf(t)>=0;if(d)done++;
  return '<div class="card item'+(d?' d':'')+'"><button class="chk" onclick="tog('+h.id+')">'+(d?'✓':'')+'</button><div><b>'+esc(h.n)+'</b><span class="mut">⏰ '+h.t+' · 🔥 '+streak(h)+' kun</span></div><button class="g" onclick="del('+h.id+')">✕</button></div>'}).join('')||'<p class="mut">Hozircha odat yoʻq. Pastdan qoʻshing.</p>';
 day.textContent='Bugun: '+t;
 prog.textContent=H.length?('Bajarildi: '+done+' / '+H.length):'Odatlar qoʻshing';
 pb.style.width=(H.length?done*100/H.length:0)+'%';
}
function ring(x,test){
 cur=test?null:x;at.textContent=x.n;alarm.className='on';
 var n=0;clearInterval(timer);
 function go(){
  beep(.3);setTimeout(function(){beep(.3)},400);
  try{navigator.vibrate&&navigator.vibrate([400,200,400])}catch(e){}
  if(n%4===0){try{
   if(window.speechSynthesis){speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(x.n);u.lang='ru-RU';speechSynthesis.speak(u)}
  }catch(e){}}
  n++;
 }
 go();timer=setInterval(go,1500);
 try{if(!test&&'Notification' in window&&Notification.permission==='granted')new Notification('Odat vaqti',{body:x.n})}catch(e){}
}
function stop(){clearInterval(timer);alarm.className='';try{speechSynthesis.cancel()}catch(e){}cur=null;busy=false}
function doneNow(){var x=cur;stop();if(x&&x.id&&x.days.indexOf(today())<0){x.days.push(today());save();draw()}}
var busy=false;
function check(){
 if(alarm.className==='on')return;
 var d=new Date(),now=pad(d.getHours())+':'+pad(d.getMinutes()),t=today();
 for(var i=0;i<H.length;i++){
  var h=H[i];
  if(h.t<=now&&h.rang!==t&&h.days.indexOf(t)<0){h.rang=t;save();ring(h);break}
 }
}
function wake(){
 try{if(ctx)ctx.resume()}catch(e){}
 try{if(ctx&&navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){})}catch(e){}
}
function onScreen(){
 if(document.visibilityState==='visible'){wake();draw();check()}
}
document.addEventListener('visibilitychange',onScreen);
window.addEventListener('focus',onScreen);
window.addEventListener('pageshow',onScreen);
setInterval(check,1000);
draw();check();sched();
</script>
</body>
  </html>
